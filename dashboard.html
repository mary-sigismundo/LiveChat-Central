
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comentários da Live – PES</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <main class="painel">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <img
                class="logo-cabecalho"
                src="https://www.paroquiaespiritosanto.com.br/min/img/logos/logo-preto-horizontal.png"
                alt="Paróquia Espírito Santo"
            >

            <div class="identificacao">
                <h1>Comentários da Live – PES</h1>
            </div>

        </header>


        <!-- BARRA SUPERIOR -->
        <section class="barra-superior">

            <div class="controles-plataformas">

                <button
                    id="botaoYoutube"
                    class="plataforma youtube"
                    type="button"
                >
                    <span class="icone-youtube">▶</span>
                    YouTube
                    <span
                        class="indicador"
                        id="indicadorYoutube"
                    ></span>
                </button>

                <button
                    id="botaoFacebook"
                    class="plataforma facebook"
                    type="button"
                >
                    <span class="icone-facebook">f</span>
                    Facebook
                    <span
                        class="indicador"
                        id="indicadorFacebook"
                    ></span>
                </button>

            </div>


            <div class="controle-fonte">

                <button
                    id="diminuirFonte"
                    type="button"
                    title="Diminuir fonte"
                >
                    −
                </button>

                <button
                    id="aumentarFonte"
                    type="button"
                    title="Aumentar fonte"
                >
                    +
                </button>

            </div>

        </section>


        <!-- ÁREA DOS COMENTÁRIOS -->
        <section class="area-comentarios">

            <div
                id="listaComentarios"
                class="lista-comentarios"
            ></div>

            <div
                id="mensagemVazia"
                class="mensagem-vazia"
            >
                Aguardando novos comentários...
            </div>

        </section>


        <!-- RODAPÉ FIXO -->
        <footer class="rodape">

            <div class="estatisticas">

                <span>
                    Recebidos:
                    <strong id="comentariosRecebidos">0</strong>
                </span>

                <span>
                    Exibidos:
                    <strong id="comentariosExibidos">0</strong>
                </span>

            </div>


            <div class="acoes-rodape">

                <button
                    id="botaoFontes"
                    class="botao-fontes"
                    type="button"
                    title="Ver as páginas que estão enviando comentários"
                >
                    Fontes
                </button>

                <button
                    id="botaoDesfazer"
                    class="botao-desfazer"
                    type="button"
                    hidden
                >
                    Desfazer exclusão
                </button>

                <button
                    id="botaoPausa"
                    class="botao-pausa"
                    type="button"
                >
                    Pausar
                </button>

            </div>

        </footer>

    </main>


    <!-- PÁGINAS DE ONDE VÊM OS COMENTÁRIOS -->
    <dialog id="janelaFontes" class="janela-fontes">

        <div class="janela-fontes-cabecalho">
            <h2>Páginas enviando comentários</h2>

            <button
                id="fecharFontes"
                class="botao-fechar-fontes"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>
        </div>

        <ul id="listaFontes" class="lista-fontes"></ul>

        <p id="fontesVazia" class="fontes-vazia">
            Nenhuma página enviou comentários ainda.
        </p>

    </dialog>


    <script src="dashboard.js"></script>

</body>
</html>
